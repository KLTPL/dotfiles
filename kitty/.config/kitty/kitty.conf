# Kitty configuration. Reload with ctrl+shift+f5 (or restart kitty).
# All options: https://sw.kovidgoyal.net/kitty/conf/

# Font (JetBrainsMono Nerd Font is also what powerlevel10k and nvim icons need)
font_family JetBrainsMono Nerd Font
font_size 12.0

# Window
window_padding_width 4
enable_audio_bell no

# Show the tab bar only when there is more than one tab
tab_bar_min_tabs 2

background_opacity 0.95


# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME